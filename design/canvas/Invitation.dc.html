<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  burst(cx, cy, ro, ri, n, sq) {
    var pts = [];
    for (var i = 0; i < n * 2; i++) {
      var a = Math.PI * i / n - Math.PI / 2;
      var r = i % 2 === 0 ? ro * (i % 4 === 0 ? 1 : 0.84) : ri;
      pts.push(Math.round(cx + Math.cos(a) * r) + ',' + Math.round(cy + Math.sin(a) * r * sq));
    }
    return pts.join(' ');
  }
  renderVals() {
    return {
      vsBurst: this.burst(60, 50, 58, 34, 10, 0.82),
      duo: [
        { id: 'inv-julie', k: 0.1, fem: true, w: 132, skin: '#9C5F3D', shorts: '#2BB5FF', glove: '#2BB5FF', top: '#2BB5FF', hair: '#140A22', trim: '#FFF4E3', boot: '#140A22', band: '#E8287C' },
        { id: 'inv-toi', k: 0.42, w: 132, flip: true, ghost: true }
      ]
    };
  }
}
