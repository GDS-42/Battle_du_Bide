<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Retouche du combattant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:ital,wght@0,400;0,500;0,700;0,800;0,900;1,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD23D}a:hover{color:#FFF4E3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1C0E33; color: #FFF4E3; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column">

  <header style="flex-shrink: 0; background: #140A22; padding: 14px 14px 12px; display: flex; align-items: center; gap: 10px">
    <a href="Galerie.dc.html" aria-label="Retour à la galerie" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 2px solid #5A2A7A; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #FFD23D; stroke-width: 2.6px; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #CDB8F0">ÉTAPE 2 SUR 2 · RETOUCHES</span>
      <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 22px; line-height: 1.15">Ton combattant</h1>
    </div>
    <span style="flex-shrink: 0; max-width: 130px; font-size: 12px; line-height: 1.25; text-align: right; color: #CDB8F0">Base :<br><b style="color: #FFD23D">La Mamie Cogneuse</b></span>
  </header>

  <section style="position: relative; height: 286px; flex-shrink: 0; overflow: hidden; background: linear-gradient(180deg, #3A1A5E 0 14%, #6B1E6E 14% 28%, #B3206F 28% 42%, #E8287C 42% 56%, #F25C4A 56% 68%, #F7893B 68% 80%, #FFB23D 80% 100%); border-bottom: 4px solid #140A22">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#140A22 1.2px, transparent 1.5px); background-size: 9px 9px; opacity: 0.13"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #2A1548; border-top: 5px solid #E8287C"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center">
      <dc-import name="Fighter" cfg="{{live}}" hint-size="196px,261px"></dc-import>
    </div>
    <div style="position: absolute; left: 12px; top: 12px; max-width: 150px; background: #140A22; border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #CDB8F0">CORPULENCE</span>
      <span style="font-size: 13px; line-height: 1.3">La tienne : IMC 30,9, silhouette entre S2 et S3</span>
    </div>
  </section>

  <nav aria-label="Catégories" style="flex-shrink: 0; padding: 12px 12px 4px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 40px; box-sizing: border-box; padding: 0 4px; border: 2px solid {{t.border}}; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Lilita One', sans-serif; font-size: 15px; cursor: pointer">{{t.label}}</button>
    </sc-for>
  </nav>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #CDB8F0">{{g.title}}</span>
        <sc-if value="{{g.isPills}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
              <button type="button" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" style="min-height: 40px; padding: 0 12px; border: 2px solid #140A22; border-radius: 999px; background: {{it.bg}}; color: {{it.fg}}; box-shadow: {{it.shadow}}; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">{{it.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{g.isSwatches}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="8">
              <button type="button" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" aria-label="{{it.label}}" title="{{it.label}}" style="width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 3px solid #140A22; background: {{it.color}}; box-shadow: {{it.ring}}; cursor: pointer"></button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; padding: 8px 14px 20px; border-top: 2px solid #2A1548">
    <a href="Pesee.dc.html" style="min-height: 58px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 25px; color: #140A22; text-decoration: none; background: #FFD23D; border: 3px solid #140A22; border-radius: 16px; box-shadow: 0 6px 0 #140A22">C'EST MOI !</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'coiffure',
      c: { base: 'B', age: 'senior', skin: 'porcelaine', hairStyle: 'bun', hairColor: 'blanc', acc: ['glassesRound'], eyes: 'ronds', outfit: 'track', main: '#5A2A7A', trim: '#FFD23D' }
    };
  }
  renderVals() {
    var self = this;
    var c = this.state.c;
    var set = function (patch) { return function () { self.setState({ c: Object.assign({}, self.state.c, patch) }); }; };
    var pill = function (label, on, pick) {
      return { label: label, pick: pick, pressed: on ? 'true' : 'false', bg: on ? '#FFD23D' : '#2A1548', fg: on ? '#140A22' : '#FFF4E3', shadow: on ? '0 3px 0 #140A22' : 'none' };
    };
    var sw = function (label, color, on, pick) {
      return { label: label, color: color, pick: pick, pressed: on ? 'true' : 'false', ring: on ? '0 0 0 3px #FFD23D' : 'none' };
    };
    var pills = function (title, key, opts) {
      return { title: title, isPills: true, isSwatches: false, items: opts.map(function (o) { var p = {}; p[key] = o[0]; return pill(o[1], (c[key] || opts[0][0]) === o[0], set(p)); }) };
    };
    var swatches = function (title, key, opts) {
      return { title: title, isPills: false, isSwatches: true, items: opts.map(function (o) { var p = {}; p[key] = o[0]; return sw(o[1], o[2] || o[0], c[key] === o[0], set(p)); }) };
    };
    var acc = c.acc || [];
    var toggleAcc = function (a) {
      return function () {
        var cur = (self.state.c.acc || []).slice();
        var i = cur.indexOf(a);
        if (i >= 0) { cur.splice(i, 1); } else {
          if (a === 'glassesRound') cur = cur.filter(function (x) { return x !== 'glassesSquare'; });
          if (a === 'glassesSquare') cur = cur.filter(function (x) { return x !== 'glassesRound'; });
          if (a === 'headband') cur = cur.filter(function (x) { return x !== 'bandana'; });
          if (a === 'bandana') cur = cur.filter(function (x) { return x !== 'headband'; });
          cur.push(a);
        }
        self.setState({ c: Object.assign({}, self.state.c, { acc: cur }) });
      };
    };
    var setOutfit = function (o) { return set({ outfit: o, main: undefined, top: undefined, bottom: undefined, glove: undefined, boot: undefined, trim: undefined }); };

    var tab = this.state.tab;
    var groups = [];
    if (tab === 'peau') groups = [swatches('TEINTE DE PEAU', 'skin', [['porcelaine', 'Porcelaine', '#F7D9C4'], ['peche', 'Pêche', '#F0B38A'], ['miel', 'Miel', '#DDA06B'], ['caramel', 'Caramel', '#C68350'], ['cannelle', 'Cannelle', '#A86B45'], ['noisette', 'Noisette', '#8E5532'], ['cacao', 'Cacao', '#6E3F25'], ['ebene', 'Ébène', '#4E2C1C']])];
    if (tab === 'visage') groups = [pills('YEUX', 'eyes', [['amande', 'Amande'], ['ronds', 'Ronds'], ['etires', 'Étirés']]), pills('NEZ', 'nose', [['fin', 'Fin'], ['large', 'Large'], ['busque', 'Busqué']]), pills('LÈVRES', 'lips', [['fines', 'Fines'], ['pleines', 'Pleines']])];
    if (tab === 'coiffure') groups = [pills('COUPE', 'hairStyle', [['spiky', 'Pétard'], ['buzz', 'Rasé'], ['mohawk', 'Crête'], ['afro', 'Afro'], ['braids', 'Tresses'], ['dreads', 'Dreads'], ['bun', 'Chignon'], ['ponytail', 'Queue de cheval'], ['long', 'Longs'], ['bob', 'Carré'], ['receding', 'Dégarni'], ['bald', 'Chauve']]), swatches('COULEUR', 'hairColor', [['noir', 'Noir', '#1B1420'], ['brun', 'Brun', '#3B2416'], ['chatain', 'Châtain', '#6B4226'], ['roux', 'Roux', '#B5532A'], ['blond', 'Blond', '#E2B54B'], ['gris', 'Gris', '#9C97A6'], ['blanc', 'Blanc', '#EDE8F2'], ['rose', 'Rose', '#FF5FA2'], ['bleu', 'Bleu', '#2BB5FF']])];
    if (tab === 'barbe') groups = [pills('BARBE ET MOUSTACHE', 'beard', [['none', 'Aucune'], ['stubble', '3 jours'], ['short', 'Courte'], ['big', 'Grande barbe'], ['moustache', 'Moustache'], ['goatee', 'Bouc']])];
    if (tab === 'accessoires') groups = [{ title: 'ACCESSOIRES (CUMULABLES)', isPills: true, isSwatches: false, items: [['glassesRound', 'Lunettes rondes'], ['glassesSquare', 'Lunettes carrées'], ['headband', 'Bandeau'], ['bandana', 'Bandana'], ['earrings', "Boucles d'oreilles"]].map(function (a) { return pill(a[1], acc.indexOf(a[0]) >= 0, toggleAcc(a[0])); }) }];
    if (tab === 'tenue') {
      groups = [{ title: 'STYLE DE COMBAT', isPills: true, isSwatches: false, items: [['boxe', 'Boxe'], ['catch', 'Catch'], ['kimono', 'Kimono'], ['mma', 'MMA'], ['track', 'Survêt rétro']].map(function (o) { return pill(o[1], (c.outfit || 'boxe') === o[0], setOutfit(o[0])); }) },
        swatches('COULEUR PRINCIPALE', 'main', [['#D22B3A', 'Rouge'], ['#2BB5FF', 'Bleu néon'], ['#FFD23D', 'Soleil'], ['#E8287C', 'Magenta'], ['#2E9E6B', 'Vert'], ['#5A2A7A', 'Prune'], ['#140A22', 'Noir'], ['#F4F1EA', 'Blanc']])];
      if (c.outfit === 'catch') groups.push({ title: 'MASQUE', isPills: true, isSwatches: false, items: [pill('Sans masque', !c.mask, set({ mask: false })), pill('Masque de catch', !!c.mask, set({ mask: true }))] });
    }
    if (tab === 'age') groups = [pills('ÂGE', 'age', [['jeune', 'Jeune'], ['adulte', 'Adulte'], ['senior', 'Senior']])];
    if (tab === 'corps') groups = [pills('SILHOUETTE DE BASE', 'base', [['A', 'Épaules larges'], ['B', 'Hanches marquées']]), { title: 'LA CORPULENCE SUIT TON IMC RÉEL, ELLE NE SE CHOISIT PAS', isPills: false, isSwatches: false, items: [] }];

    var tabs = [['peau', 'Peau'], ['visage', 'Visage'], ['coiffure', 'Coiffure'], ['barbe', 'Barbe'], ['accessoires', 'Access.'], ['tenue', 'Tenue'], ['age', 'Âge'], ['corps', 'Corps']].map(function (t) {
      var on = t[0] === tab;
      return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#FFD23D' : '#2A1548', fg: on ? '#140A22' : '#FFF4E3', border: on ? '#140A22' : '#5A2A7A', pick: function () { self.setState({ tab: t[0] }); } };
    });

    return {
      live: Object.assign({}, c, { id: 'cr-live', w: 196, k: 0.62 }),
      tabs: tabs,
      groups: groups
    };
  }
}
</script>
</body>
</html>
