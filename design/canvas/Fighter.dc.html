      var n = pts.length, d = 'M ' + r1(pts[0].x) + ' ' + r1(pts[0].y);
      for (var i = 0; i < n; i++) {
        var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];

      var rEnd = r1((nodes[n - 1].w + (extra || 0)) / 2), rStart = r1((nodes[0].w + (extra || 0)) / 2);
